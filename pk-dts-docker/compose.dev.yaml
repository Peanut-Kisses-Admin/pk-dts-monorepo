name: pk-dms-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ../pk-dts-backend
      dockerfile: Dockerfile.dev
    command:
      [
        "sh",
        "-c",
        "node scripts/prisma-env.js generate && node scripts/prepare-postgres-startup.js && node scripts/prisma-db-push-retry.js && npm run prisma:seed && npm run start:dev",
      ]
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PROVIDER: postgresql
      PRISMA_SCHEMA_PATH: prisma/schema.postgresql.prisma
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: ${SERVER_PUBLIC_BASE_URL}
      UPLOAD_BASE_URL: ${SERVER_PUBLIC_BASE_URL}
      BACKUP_RESTORE_DIR: /app/backup-store
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../pk-dts-backend:/app
      - backend_node_modules:/app/node_modules
      - backend_dist:/app/dist
      - ./backups:/app/backup-store
      - ./data/uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:3000/api/v1/health', (res) => { res.resume(); process.exit(res.statusCode >= 200 && res.statusCode < 300 ? 0 : 1); }); req.setTimeout(4000, () => { req.destroy(new Error('timeout')); process.exit(1); }); req.on('error', () => process.exit(1));\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ../pk-dts-frontend
      dockerfile: Dockerfile.dev
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--port", "4200", "--poll", "1000", "--hmr"]
    init: true
    restart: unless-stopped
    environment:
      BACKEND_API_BASE_URL: ${PUBLIC_API_URL}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../pk-dts-frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_angular_cache:/app/.angular
    ports:
      - "${FRONTEND_PORT:-3000}:4200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:4200/', (res) => { res.resume(); process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1); }); req.setTimeout(4000, () => { req.destroy(new Error('timeout')); process.exit(1); }); req.on('error', () => process.exit(1));\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  backend_node_modules:
  backend_dist:
  frontend_node_modules:
  frontend_angular_cache:
